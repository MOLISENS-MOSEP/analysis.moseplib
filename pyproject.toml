[project]
name = "moseplib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christoph Gaisberger", email = "chrisi@all-crew.com" }
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.2.3",
    "pointcloudset>=0.9.0",
    "pyarrow>=19.0.1",
    "rich>=12.4.1",
    "rosbags>=0.9.23",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
extract_metadata = "moseplib.cli.get_metadata_from_bagfiles:arg_main"

[tool.setuptools.package-data]
moseplib = ["config/custom_ros_msgs/lufft_wsx_interfaces/msg/*"]
